<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài tập 36 - Mini game hứng táo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #e8eef5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    h1 { margin-bottom: 12px; }

    /* Dòng điểm số và mạng sống */
    .hud { width: 500px; max-width: 100%; display: flex; justify-content: space-between; font-size: 20px; margin-bottom: 10px; }

    /* Khung game: 500x400, bo góc, nền sáng, relative + overflow hidden */
    #game-container {
      width: 500px; height: 400px; max-width: 100%;
      position: relative; overflow: hidden;
      border: 3px solid #4a5868; border-radius: 14px;
      background: #eaf6ff;
    }

    /* Giỏ hứng: hình chữ nhật màu nâu ở đáy khung */
    #basket {
      position: absolute; bottom: 0; left: 210px;
      width: 80px; height: 24px;
      background: #8b5a2b; border-radius: 0 0 12px 12px;
    }

    /* Quả táo: hình tròn màu đỏ */
    #apple {
      position: absolute; top: 0; left: 100px;
      width: 30px; height: 30px;
      background: #d32f2f; border-radius: 50%;
    }

    /* Lớp phủ Game Over */
    #gameover {
      position: absolute; inset: 0;
      background: rgba(0, 0, 0, 0.7); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      font-size: 22px;
    }
    #gameover h2 { font-size: 38px; color: #ff6b6b; }
    .hidden { display: none !important; }

    #startBtn { margin-top: 14px; padding: 10px 28px; font-size: 18px; border: none; border-radius: 8px; background: #1f5fbf; color: #fff; cursor: pointer; }
    #startBtn:disabled { background: #8a97a4; cursor: not-allowed; }
    .note { margin-top: 10px; color: #4a5868; }
    a { margin-top: 14px; color: #1f5fbf; }
  </style>
</head>
<body>
  <h1>Hứng táo</h1>

  <div class="hud">
    <span>Điểm: <b id="score">0</b></span>
    <span>Mạng: <b id="lives">3</b></span>
  </div>

  <div id="game-container">
    <div id="apple"></div>
    <div id="basket"></div>
    <div id="gameover" class="hidden">
      <h2>Game Over</h2>
      <p>Điểm của bạn: <b id="finalScore">0</b></p>
    </div>
  </div>

  <button id="startBtn">Bắt đầu</button>
  <p class="note">Dùng phím ← và → để di chuyển giỏ.</p>
  <a href="index.html">← Về trang chủ</a>

  <script>
    // ===== Lấy các phần tử =====
    const container = document.getElementById('game-container'); // Khung game
    const basket    = document.getElementById('basket');         // Giỏ hứng
    const apple     = document.getElementById('apple');          // Quả táo
    const scoreEl   = document.getElementById('score');          // Chỗ hiện điểm
    const livesEl   = document.getElementById('lives');          // Chỗ hiện mạng
    const startBtn  = document.getElementById('startBtn');       // Nút Bắt đầu
    const overBox   = document.getElementById('gameover');       // Lớp phủ Game Over
    const finalEl   = document.getElementById('finalScore');     // Điểm cuối

    // ===== Hằng số và biến trạng thái =====
    const BASKET_SPEED = 360;  // Tốc độ giỏ: pixel mỗi giây
    const START_SPEED  = 150;  // Tốc độ rơi ban đầu của táo: pixel mỗi giây
    const SPEED_STEP   = 15;   // Mỗi lần hứng được, tốc độ tăng thêm chừng này

    let score = 0, lives = 3;      // Điểm và mạng sống
    let appleY = 0, appleSpeed = START_SPEED; // Vị trí top của táo và tốc độ rơi hiện tại
    let basketX = 210;             // Vị trí left của giỏ
    let rafId = null;              // Mã của requestAnimationFrame để dừng vòng lặp
    let lastTime = 0;              // Thời điểm khung hình trước
    let leftDown = false, rightDown = false; // Trạng thái giữ phím trái/phải

    // ===== Đặt táo ở vị trí ngẫu nhiên trên đỉnh =====
    function resetApple() {
      appleY = -apple.offsetHeight;                                  // Bắt đầu ngay phía trên khung
      const maxX = container.clientWidth - apple.offsetWidth;        // Vị trí ngang lớn nhất để không tràn
      apple.style.left = Math.floor(Math.random() * maxX) + 'px';    // left ngẫu nhiên
    }

    // ===== Điều khiển giỏ bằng phím mũi tên =====
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft')  { leftDown = true;  e.preventDefault(); } // Chặn cuộn trang
      if (e.key === 'ArrowRight') { rightDown = true; e.preventDefault(); }
    });
    document.addEventListener('keyup', function (e) {
      if (e.key === 'ArrowLeft')  leftDown = false;
      if (e.key === 'ArrowRight') rightDown = false;
    });

    // ===== Kiểm tra va chạm giữa táo và giỏ (hai hình chữ nhật giao nhau) =====
    function isCollide() {
      const appleX = apple.offsetLeft;
      return appleY + apple.offsetHeight >= container.clientHeight - basket.offsetHeight // Đáy táo chạm mặt giỏ
          && appleX + apple.offsetWidth > basketX                                         // Phải của táo vượt mép trái giỏ
          && appleX < basketX + basket.offsetWidth;                                       // Trái của táo chưa quá mép phải giỏ
    }

    // ===== Vòng lặp game, chạy mỗi khung hình =====
    function loop(now) {
      const dt = (now - lastTime) / 1000;  // Thời gian giữa hai khung hình (giây)
      lastTime = now;

      // 1. Di chuyển giỏ, giới hạn trong khung
      if (leftDown)  basketX -= BASKET_SPEED * dt;
      if (rightDown) basketX += BASKET_SPEED * dt;
      basketX = Math.max(0, Math.min(basketX, container.clientWidth - basket.offsetWidth)); // Không ra ngoài khung
      basket.style.left = basketX + 'px';

      // 2. Táo rơi xuống theo trục tung
      appleY += appleSpeed * dt;
      apple.style.top = appleY + 'px';

      // 3. Va chạm: hứng được thì cộng điểm, tăng tốc, táo hồi sinh
      if (isCollide()) {
        score++;
        scoreEl.textContent = score;
        appleSpeed += SPEED_STEP;
        resetApple();
      }
      // 4. Chạm đáy mà không hứng được: mất 1 mạng, táo reset
      else if (appleY >= container.clientHeight) {
        lives--;
        livesEl.textContent = lives;
        resetApple();
        if (lives <= 0) { endGame(); return; }   // Hết mạng thì dừng vòng lặp
      }

      rafId = requestAnimationFrame(loop);        // Gọi tiếp khung hình sau
    }

    // ===== Kết thúc game =====
    function endGame() {
      cancelAnimationFrame(rafId);   // Dừng vòng lặp
      rafId = null;
      finalEl.textContent = score;
      overBox.classList.remove('hidden');  // Hiện "Game Over"
      startBtn.textContent = 'Chơi lại';
      startBtn.disabled = false;
    }

    // ===== Bắt đầu / chơi lại =====
    startBtn.addEventListener('click', function () {
      if (rafId !== null) return;          // Đang chạy thì không tạo vòng lặp thứ hai
      score = 0; lives = 3; appleSpeed = START_SPEED; basketX = 210;
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      overBox.classList.add('hidden');
      startBtn.disabled = true;            // Khóa nút trong lúc chơi
      resetApple();
      lastTime = performance.now();
      rafId = requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
